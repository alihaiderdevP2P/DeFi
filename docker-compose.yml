version: "3.9"
services:
  server:
    image: node:20
    working_dir: /app
    volumes:
      - ./server:/app
    command: sh -c "npm install && npm run start:dev"
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env

  client:
    image: node:20
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
    depends_on:
      - server
